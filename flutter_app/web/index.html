<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="IRKOP Konter">
  <title>IRKOP Konter</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html,body{margin:0;width:100%;height:100%;background:#f8fafd;font-family:Arial,sans-serif}
    #irkop-loading{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#12325c;gap:14px;z-index:9999}
    #irkop-loading .mark{width:54px;height:54px;border-radius:18px;background:#12325c;color:#fff;display:grid;place-items:center;font-weight:800;font-size:18px}
    #irkop-loading .spin{width:28px;height:28px;border:3px solid #dce6f5;border-top-color:#12325c;border-radius:50%;animation:spin 1s linear infinite}
    #irkop-loading.error .spin{display:none}
    #irkop-loading.error{color:#7a1f1f}
    @keyframes spin{to{transform:rotate(360deg)}}
  </style>
</head>
<body>
  <div id="irkop-loading">
    <div class="mark">IR</div>
    <strong>Memuat IRKOP Konter</strong>
    <div class="spin"></div>
    <small id="irkop-loading-message">Menyiapkan aplikasi...</small>
  </div>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function (registrations) {
        registrations.forEach(function (registration) {
          registration.unregister();
        });
      });
    }

    window.addEventListener('error', function (event) {
      var box = document.getElementById('irkop-loading');
      var message = document.getElementById('irkop-loading-message');
      if (box && message) {
        box.classList.add('error');
        message.textContent = 'Gagal memuat aplikasi. Silakan muat ulang.';
      }
    });

    setTimeout(function () {
      var box = document.getElementById('irkop-loading');
      if (box) {
        box.classList.add('error');
        document.getElementById('irkop-loading-message').textContent =
          'Aplikasi membutuhkan waktu lebih lama. Silakan muat ulang.';
      }
    }, 20000);
  </script>
  <script src="flutter_bootstrap.js" async onload="document.getElementById('irkop-loading')?.remove()"></script>
</body>
</html>
