name: Build Flutter Web

on:
  push:
    branches: [master]
    paths-ignore:
      - 'planning/**'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: web-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter_app
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          pub-cache: true

      - name: Build Flutter Web
        run: |
          set +e
          flutter build web --release --pwa-strategy=none --base-href "/irkop-konter/" \
            --dart-define=SUPABASE_URL="${{ secrets.SUPABASE_URL }}" \
            --dart-define=SUPABASE_ANON_KEY="${{ secrets.SUPABASE_ANON_KEY }}"
          BUILD_STATUS=$?
          set -e

          if [ $BUILD_STATUS -ne 0 ]; then
            echo "Direct build failed. Restoring dependencies with flutter pub get..."
            flutter pub get
            flutter build web --release --pwa-strategy=none --base-href "/irkop-konter/" \
              --dart-define=SUPABASE_URL="${{ secrets.SUPABASE_URL }}" \
              --dart-define=SUPABASE_ANON_KEY="${{ secrets.SUPABASE_ANON_KEY }}"
          else
            echo "Direct build succeeded using cache."
          fi

      - name: Publish build to master/docs
        working-directory: .
        run: |
          rm -rf docs
          mkdir -p docs
          cp -a flutter_app/build/web/. docs/
          touch docs/.nojekyll

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs

          if git diff --cached --quiet; then
            echo "No generated web changes to commit."
          else
            git commit -m "chore: publish web build to master/docs"
            git push origin HEAD:master
          fi
