name: Build Flutter Web

on:
  push:
    branches: [master]
    paths-ignore:
      - 'planning/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: web-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          pub-cache: true
      - name: Build Flutter Web
        run: |
          set +e
          flutter build web --release --pwa-strategy=none --base-href "/irkop-konter/" \
            --dart-define=SUPABASE_URL="${{ secrets.SUPABASE_URL }}" \
            --dart-define=SUPABASE_ANON_KEY="${{ secrets.SUPABASE_ANON_KEY }}"
          BUILD_STATUS=$?
          set -e

          if [ $BUILD_STATUS -ne 0 ]; then
            echo "Direct build failed. Restoring dependencies with flutter pub get..."
            flutter pub get
            flutter build web --release --pwa-strategy=none --base-href "/irkop-konter/" \
              --dart-define=SUPABASE_URL="${{ secrets.SUPABASE_URL }}" \
              --dart-define=SUPABASE_ANON_KEY="${{ secrets.SUPABASE_ANON_KEY }}"
          else
            echo "Direct build succeeded using restored cache."
          fi
      - name: Cache-bust Flutter web assets
        run: |
          sed -i "s/flutter_bootstrap.js/flutter_bootstrap.js?v=${GITHUB_SHA}/g" build/web/index.html
          sed -i "s/main.dart.js/main.dart.js?v=${GITHUB_SHA}/g" build/web/index.html
      - name: Deploy web directly to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./flutter_app/build/web
          publish_branch: gh-pages
