name: Fast Build and Publish Flutter Web (v2)

on:
  push:
    branches: [v2]
    paths-ignore:
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: flutter-web-v2
  cancel-in-progress: true

jobs:
  build-v2:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter_app

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build web for GitHub Pages
        run: |
          flutter build web --release --pwa-strategy=none --base-href /irkop-konter/ \
            --dart-define=SUPABASE_URL="${{ secrets.SUPABASE_URL }}" \
            --dart-define=SUPABASE_ANON_KEY="${{ secrets.SUPABASE_ANON_KEY }}"

      - name: Publish web build to docs
        working-directory: .
        run: |
          rm -rf docs
          mkdir -p docs
          cp -R flutter_app/build/web/. docs/
          touch docs/.nojekyll

      - name: Commit published web build
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          git diff --cached --quiet || git commit -m "chore(v2): publish latest web build"
          git push origin HEAD:v2
