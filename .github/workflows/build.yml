name: Validate IRKOP Konter Web

on:
  push:
    branches: [master]
    paths:
      - 'flutter_app/**'
      - '.github/workflows/build.yml'
  pull_request:
    branches: [master]
    paths:
      - 'flutter_app/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Flutter Web platform
        run: flutter create --platforms=web --project-name irkop_cell .
      - name: Get dependencies
        run: flutter pub get
      - name: Analyze application
        run: flutter analyze lib
      - name: Build Web
        run: |
          flutter build web --release --base-href "/irkop-konter/" \
            --dart-define=SUPABASE_URL="${{ secrets.SUPABASE_URL }}" \
            --dart-define=SUPABASE_ANON_KEY="${{ secrets.SUPABASE_ANON_KEY }}"
        with:
          name: irkop-konter-web
          path: flutter_app/build/web
          if-no-files-found: error
