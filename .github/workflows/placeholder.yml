name: Repository Guard

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  repository-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify project files
        run: |
          test -f README.md
          test -f flutter_app/pubspec.yaml
          test -f supabase/migrations/20260831_000001_irkop_cell.sql
          test -f supabase/seed/irkop_cell_demo_seed.sql
